name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Google TV -sovellus (APK)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Boksin lisäosa (ipk, APK mukana)
        run: |
          E2TVPLAYER_APK=$PWD/android/app/build/outputs/apk/release/E2TVPlayer.apk OUT=$PWD/dist sh enigma2/build_ipk.sh
          cp android/app/build/outputs/apk/release/E2TVPlayer.apk dist/
          python3 enigma2/tools/build_wgt.py dist/E2TVPlayer.wgt
          "$ANDROID_HOME"/build-tools/34.0.0/aapt dump badging dist/E2TVPlayer.apk | grep -E "package|leanback|launchable|sdkVersion" | tee dist/badging.txt
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: e2tvplayer
          path: dist/*

      - name: Julkaisu (tagi v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.ipk
            dist/*.wgt

  web-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Käännökset ajan tasalla (po/*.po)
        run: python3 tools/i18n.py check
      - name: Samsung (Orsay) ja Tizen -sovellusten testit
        working-directory: tests/web
        run: |
          npm install --no-audit --no-fund
          npm test

  tv-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: e2tvplayer
          path: dist

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Simuloitu boksi
        run: |
          mkdir -p apk && cp dist/E2TVPlayer.apk apk/
          sudo nohup python3 tests/fake_box.py 80 > box.log 2>&1 &
          sleep 2 && curl -s http://127.0.0.1/e2tvplayer/info

      - name: Emulaattoritesti
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: OUT=shots sh tests/tv_test.sh

      - name: Tulokset builds-haaraan
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cp -r dist out/ && cp -r shots out/ 2>/dev/null || true
          cp box.log out/ 2>/dev/null || true
          cd out
          git init -q && git checkout -q -b builds
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "build ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" builds
