name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Google TV -sovellus (APK)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Boksin lisäosa (ipk, APK mukana)
        run: |
          E2TVPLAYER_APK=$PWD/android/app/build/outputs/apk/release/E2TVPlayer.apk OUT=$PWD/dist sh enigma2/build_ipk.sh
          cp android/app/build/outputs/apk/release/E2TVPlayer.apk dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: e2tvplayer
          path: dist/*

      - name: Julkaisu (tagi v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
