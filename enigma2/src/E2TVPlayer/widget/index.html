<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>E2TVPlayer</title>
	<link rel="stylesheet" type="text/css" href="css/style.css" />
	<script type="text/javascript" src="$MANAGER_WIDGET/Common/API/Widget.js"></script>
	<script type="text/javascript" src="$MANAGER_WIDGET/Common/API/TVKeyValue.js"></script>
	<script type="text/javascript" src="$MANAGER_WIDGET/Common/API/Plugin.js"></script>
	<script type="text/javascript" src="js/boxconfig.js"></script>
	<script type="text/javascript" src="js/util.js"></script>
	<script type="text/javascript" src="js/api.js"></script>
	<script type="text/javascript" src="js/listview.js"></script>
	<script type="text/javascript" src="js/player.js"></script>
	<script type="text/javascript" src="js/subs.js"></script>
	<script type="text/javascript" src="js/views.js"></script>
	<script type="text/javascript" src="js/main.js"></script>
</head>
<body onload="App.onLoad();" onunload="App.onUnload();">
	<object id="pluginPlayer" border="0" classid="clsid:SAMSUNG-INFOLINK-PLAYER" style="position:absolute;left:0;top:0;width:0;height:0;"></object>
	<object id="pluginTVMW" border="0" classid="clsid:SAMSUNG-INFOLINK-TVMW" style="position:absolute;left:0;top:0;width:0;height:0;"></object>
	<object id="pluginNNavi" border="0" classid="clsid:SAMSUNG-INFOLINK-NNAVI" style="position:absolute;left:0;top:0;width:0;height:0;"></object>

	<a href="javascript:void(0);" id="anchor"></a>

	<div id="app">
		<div id="header">
			<div id="title">E2<span>TV</span>Player</div>
			<div id="crumb"></div>
			<div id="clock"></div>
		</div>
		<div id="nowbar"></div>

		<!-- Recordings / channels: list on the left, details on the right -->
		<div id="browser">
			<div id="listbox">
				<div id="list"></div>
				<div id="scroll"><div id="scrollthumb"></div></div>
				<div id="empty"></div>
			</div>
			<div id="details">
				<div id="d-title"></div>
				<div id="d-meta"></div>
				<div id="d-desc"></div>
			</div>
		</div>

		<!-- Settings -->
		<div id="settings">
			<div class="s-head">Box address</div>
			<div class="s-help">Number keys enter digits, left/right moves between fields, up/down changes the value.</div>
			<div id="s-fields"></div>
			<div id="s-info"></div>
			<div class="s-keys"><span class="k k-ok">OK</span> Save &nbsp; <span class="k k-red"></span> Reset &nbsp; <span class="k k-green"></span> Screen size &nbsp; <span class="k k-ret">RETURN</span> Cancel</div>
		</div>

		<div id="footer"></div>
	</div>

	<!-- Subtitles extracted by the box, over the video -->
	<div id="sublayer"><img id="subimg" src="" alt="" /></div>
	<!-- Bar shown over playback -->
	<div id="osd">
		<div id="osd-title"></div>
		<div id="osd-sub"></div>
		<div id="osd-bar"><div id="osd-fill"></div></div>
		<div id="osd-time"></div>
		<div id="osd-state"></div>
		<div id="osd-keys">&#9664;&#9654; 15 s &nbsp; &#9650;&#9660; 5 min &nbsp; &#9194;&#9193; 1 min &nbsp; OK pause &nbsp; RETURN stop</div>
	</div>
	<!-- INFO panel during playback -->
	<div id="info">
		<div id="i-title"></div>
		<div id="i-meta"></div>
		<div id="i-desc"></div>
		<div id="i-next"></div>
	</div>
	<!-- TOOLS: audio, subtitles, language, screenshot -->
	<div id="tracks">
		<div class="tr-head">Audio and subtitles</div>
		<div id="tr-rows"></div>
		<div id="tr-diag"></div>
		<div class="tr-keys">▲▼ row &nbsp; ◀▶ change &nbsp; OK/RETURN close</div>
	</div>
	<div id="subs"></div>
	<div id="busy"><div id="busy-text">Loading&hellip;</div></div>
	<div id="dialog">
		<div id="dlg-title"></div>
		<div id="dlg-text"></div>
		<div id="dlg-buttons"></div>
	</div>
	<div id="toast"></div>
</body>
</html>
